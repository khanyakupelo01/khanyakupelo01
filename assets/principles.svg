<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="How I work: Types end to end. Strict TypeScript and schema validation at every boundary.; Data you can audit. Append-only records and explicit corrections. No silent changes.; Contracts first. Specs and OpenAPI before code, so teams build in parallel.; Secure by default. Least-privilege roles, minimal personal data, clean logs.">
