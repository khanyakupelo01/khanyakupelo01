<text class="eyebrow" x="52" y="66">HOW I WORK</text><rect x="52" y="96" width="532" height="130" rx="16" fill="#2C2C2E"/><circle cx="82" cy="134" r="6" fill="#2997FF"/><text class="h" x="100" y="141">Types end to end</text><text class="sub" x="82" y="176">Strict TypeScript and schema</text><text class="sub" x="82" y="199">validation at every boundary.</text><rect x="616" y="96" width="532" height="130" rx="16" fill="#2C2C2E"/><circle cx="646" cy="134" r="6" fill="#2997FF"/><text class="h" x="664" y="141">Data you can audit</text><text class="sub" x="646" y="176">Append-only records and explicit</text><text class="sub" x="646" y="199">corrections. No silent changes.</text><rect x="52" y="250" width="532" height="130" rx="16" fill="#2C2C2E"/><circle cx="82" cy="288" r="6" fill="#2997FF"/><text class="h" x="100" y="295">Contracts first</text><text class="sub" x="82" y="330">Specs and OpenAPI before code,</text><text class="sub" x="82" y="353">so teams build in parallel.</text><rect x="616" y="250" width="532" height="130" rx="16" fill="#2C2C2E"/><circle cx="646" cy="288" r="6" fill="#2997FF"/><text class="h" x="664" y="295">Secure by default</text><text class="sub" x="646" y="330">Least-privilege roles, minimal</text><text class="sub" x="646" y="353">personal data, clean logs.</text>
